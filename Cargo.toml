[workspace]
resolver = "3"
members = [
    "crates/easyscribe-core",
    "crates/easyscribe",
    "crates/easyscribe-pack",
]

[workspace.package]
version = "4.0.2"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
log = { version = "0.4", features = ["std"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
cpal = "0.18"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
sherpa-rs = { version = "0.6.8", default-features = false }
whisper-rs = { version = "0.16", default-features = false }

[profile.release]
codegen-units = 1
incremental = false
lto = "thin"
strip = true

# Fast local/CI smoke profile when release build time matters more than the
# last few percent of runtime speed. The shipped release uses the settings
# above.
[profile.release-fast]
inherits = "release"
codegen-units = 16
incremental = true

[profile.dev.package."*"]
debug = false
