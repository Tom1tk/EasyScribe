[workspace]
resolver = "3"
members = [
    "crates/easyscribe-core",
    "crates/easyscribe",
    "crates/easyscribe-pack",
]

[workspace.package]
version = "3.2.3"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
log = { version = "0.4", features = ["std"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
cpal = "0.18"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
whisper-rs = { version = "0.16", default-features = false }

[profile.release]
codegen-units = 16
incremental = true
lto = "thin"
strip = true

[profile.dev.package."*"]
debug = false
