name: Rune build

on:
  push:
    branches: [rune-rewrite]
  pull_request:
    branches: [rune-rewrite]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libasound2-dev libudev-dev \
            libxkbcommon-dev pkg-config cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the Windows app
        run: cargo check --workspace
