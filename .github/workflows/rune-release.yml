name: Rune Windows Release

# Builds the single-file Rust/Rune EasyScribe.exe and publishes it as a draft
# pre-release. Manual dispatch only. The tag must contain a hyphen so GitHub
# marks the release as a pre-release even if the draft is later published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must contain a hyphen), e.g. v3.2.3-rust.1'
        required: true
        default: 'v3.2.3-rust.1'

permissions:
  contents: write

concurrency:
  group: rune-windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TAG: ${{ inputs.tag }}
      # The 1.12.9 Windows static libraries are built with the static MSVC
      # runtime. Match that for Rust and for the vendored whisper.cpp.
      # advapi32 supplies the ETW and registry imports that onnxruntime and
      # espeak-ng use; their static libs do not always carry the defaultlib.
      RUSTFLAGS: "-C target-feature=+crt-static -C link-arg=advapi32.lib"
      CMAKE_MSVC_RUNTIME_LIBRARY: "MultiThreaded"
      CMAKE_POLICY_DEFAULT_CMP0091: "NEW"
      GGML_NATIVE: "OFF"
      # Force the AVX2 kernels explicitly. whisper.cpp's CMake turns them on
      # by default for a native build, but a restored build directory can hide
      # the choice; the release needs the same fast CPU path every time.
      GGML_AVX: "ON"
      GGML_AVX2: "ON"

    steps:
      - name: Check out the Rune branch
        uses: actions/checkout@v4
        with:
          ref: rune-rewrite

      - name: Record the build revision
        id: revision
        shell: pwsh
        run: |
          $rev = (git rev-parse HEAD).Trim()
          "sha=$rev" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building $rev"

      - name: Validate the release tag
        shell: pwsh
        run: |
          $versionLine = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine) { throw "Could not read the workspace version from Cargo.toml" }
          $version = $versionLine.Matches[0].Groups[1].Value
          if (-not $env:TAG.StartsWith("v$version-")) {
            throw "The tag must start with v$version-, matching the workspace version; got '$env:TAG'."
          }
          if ($env:TAG -notmatch '^v[0-9A-Za-z._-]+-[0-9A-Za-z._-]+$') {
            throw "The tag must contain a hyphen (for a pre-release), e.g. v3.2.3-rust.1; got '$env:TAG'."
          }
          Write-Host "Building draft pre-release $env:TAG"
          Add-Content $env:GITHUB_ENV "APP_VERSION=$version"

      - name: Set up the MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Put MSVC tools on PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: Swatinem/rust-cache@v2
        with:
          key: rune-windows-release-2

      # sherpa-rs-sys 0.6.8 vendors sherpa-onnx 1.12.9. The C API gained fields
      # in 1.13.x, so using those libraries with these bindings is undefined
      # behaviour. The 1.12.9 static archive is built with the static CRT.
      - name: Cache sherpa-onnx static libraries
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: sherpa-static
          key: sherpa-onnx-1.12.9-win-x64-static-v1

      - name: Download sherpa-onnx static libraries
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.9/sherpa-onnx-v1.12.9-win-x64-static.tar.bz2"
          $expected = "4f3ada021afc97497f7570db622370a43c9b44d47d3dfb649aa0a7133a7afe58"
          Invoke-WebRequest -Uri $url -OutFile sherpa-static.tar.bz2
          $actual = (Get-FileHash sherpa-static.tar.bz2 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "sherpa archive checksum mismatch: $actual" }
          New-Item -ItemType Directory -Force sherpa-static | Out-Null
          tar xjf sherpa-static.tar.bz2 -C sherpa-static
          Remove-Item sherpa-static.tar.bz2
          $libs = Get-ChildItem sherpa-static -Recurse -Filter sherpa-onnx-c-api.lib | Select-Object -First 1
          if (-not $libs) { throw "sherpa-onnx-c-api.lib not found in the downloaded archive" }
          Write-Host "Static sherpa libraries ready."

      - name: Point Cargo at the static sherpa libraries
        shell: pwsh
        run: |
          $capi = Get-ChildItem sherpa-static -Recurse -Filter sherpa-onnx-c-api.lib | Select-Object -First 1
          if (-not $capi) { throw "sherpa-onnx-c-api.lib not found" }
          $root = $capi.Directory.Parent.FullName
          Add-Content $env:GITHUB_ENV "SHERPA_LIB_PATH=$root"
          Write-Host "SHERPA_LIB_PATH=$root"

      # ffmpeg (GyanD 7.1.1 essentials, pinned). Kept as a cache so release
      # rebuilds do not download 150 MB each time.
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: tools\ffmpeg
          key: ffmpeg-win64-gyan-7.1.1-essentials-v1

      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          New-Item -ItemType Directory -Force tools\ffmpeg | Out-Null
          $bin = (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item "$bin\ffmpeg.exe" tools\ffmpeg\ffmpeg.exe
          Copy-Item "$bin\ffprobe.exe" tools\ffmpeg\ffprobe.exe
          Remove-Item ffmpeg_tmp, ffmpeg.zip -Recurse -Force

      # Models. These are the same hashes/URLs the v3.2.3 Python release used.
      - name: Cache Whisper ONNX model
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: models\whisper
          key: sherpa-onnx-whisper-turbo-v1

      - name: Download Whisper ONNX model
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force models\whisper | Out-Null
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-turbo.tar.bz2" -OutFile whisper.tar.bz2
          tar xjf whisper.tar.bz2
          Copy-Item "sherpa-onnx-whisper-turbo\turbo-encoder.int8.onnx" models\whisper\
          Copy-Item "sherpa-onnx-whisper-turbo\turbo-decoder.int8.onnx" models\whisper\
          Copy-Item "sherpa-onnx-whisper-turbo\turbo-tokens.txt" models\whisper\
          Remove-Item sherpa-onnx-whisper-turbo, whisper.tar.bz2 -Recurse -Force

      - name: Cache Silero VAD model
        id: vad-cache
        uses: actions/cache@v4
        with:
          path: models\silero_vad.onnx
          key: sherpa-onnx-silero-vad-v1

      - name: Download Silero VAD model
        if: steps.vad-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx" -OutFile models\silero_vad.onnx

      - name: Cache diarization models
        id: diarization-cache
        uses: actions/cache@v4
        with:
          path: models\diarization
          key: sherpa-onnx-diarization-v1

      - name: Download diarization models
        if: steps.diarization-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force models\diarization | Out-Null
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2" -OutFile segmentation.tar.bz2
          tar xjf segmentation.tar.bz2
          Move-Item -Force "sherpa-onnx-pyannote-segmentation-3-0\model.onnx" models\diarization\segmentation.onnx
          Remove-Item sherpa-onnx-pyannote-segmentation-3-0, segmentation.tar.bz2 -Recurse -Force
          # "recongition" is upstream's release tag; do not correct it.
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx" -OutFile models\diarization\embedding.onnx

      - name: Cache whisper.cpp GGUF model
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: whispercpp\ggml-large-v3-turbo-q5_0.bin
          # Rune-specific key: the Python release caches the same file under
          # models\ with a different path, and sharing its key would restore
          # the file into the wrong directory (or miss it).
          key: rune-ggml-large-v3-turbo-q5_0-v1

      - name: Download whisper.cpp GGUF model
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force whispercpp | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin" -OutFile whispercpp\ggml-large-v3-turbo-q5_0.bin

      - name: Verify the whisper.cpp GGUF model
        shell: pwsh
        run: |
          $model = "whispercpp\ggml-large-v3-turbo-q5_0.bin"
          if (-not (Test-Path $model)) { throw "The GGUF model was not downloaded" }
          $expected = "394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2"
          $actual = (Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "GGUF checksum mismatch: $actual" }
          Write-Host "GGUF sha256 verified: $actual"

      - name: Save the whisper.cpp GGUF cache
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: whispercpp\ggml-large-v3-turbo-q5_0.bin
          key: rune-ggml-large-v3-turbo-q5_0-v1

      # whisper-cli is the proven file-transcription engine from v3.2.3. It is
      # built with Vulkan so the GPU is used when a driver exists, and it runs
      # as a child process so a driver crash cannot take the app down. The
      # build is cached with the same key the Python release uses.
      - name: Cache whisper.cpp Vulkan build
        id: whispercpp-cache
        uses: actions/cache@v4
        with:
          path: whisper.cpp\build\bin\Release
          key: whispercpp-vulkan-v1.8.6-vksdk1.4.313.2-v2

      - name: Install Vulkan SDK
        if: steps.whispercpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = "1.4.313.2"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile VulkanSDK.exe
          & .\VulkanSDK.exe --accept-licenses --default-answer --confirm-command install
          Remove-Item VulkanSDK.exe
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$ver"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$ver\Bin"

      - name: Build whisper-cli.exe (Vulkan)
        if: steps.whispercpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --branch v1.8.6 --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp\build -A x64 `
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DWHISPER_SDL2=OFF
          if ($LASTEXITCODE -ne 0) { throw "whisper.cpp configure failed" }
          cmake --build whisper.cpp\build --config Release --target whisper-cli --parallel
          if ($LASTEXITCODE -ne 0) { throw "whisper.cpp build failed" }
          $cache = Get-Content "whisper.cpp\build\CMakeCache.txt"
          # This is a multi-config Visual Studio build: CMAKE_BUILD_TYPE is
          # empty and the configuration is selected by --config Release, so the
          # Release binary path is the build-type assertion here. ggml's CMake
          # defines FMA/F16C only for non-MSVC builds; on MSVC they are implied
          # by AVX2, so AVX2 is the meaningful CPU assertion.
          foreach ($entry in @(
            "GGML_NATIVE:BOOL=OFF",
            "GGML_AVX2:BOOL=ON"
          )) {
            if (-not ($cache -contains $entry)) { throw "whisper-cli was not built with $entry" }
          }
          # ggml-vulkan.dll imports vulkan-1.dll at load time. Ship the Khronos
          # loader beside the CLI so a PC without a graphics driver can still
          # start whisper-cli and decode on the CPU instead of failing to load.
          # The SDK installs the loader through VulkanRT into System32; older
          # SDK layouts also keep a copy under Bin.
          $loader = Join-Path $env:SystemRoot "System32\vulkan-1.dll"
          if (-not (Test-Path $loader)) { $loader = Join-Path $env:VULKAN_SDK "Bin\vulkan-1.dll" }
          if (-not (Test-Path $loader)) { throw "vulkan-1.dll was not installed by the Vulkan SDK" }
          Copy-Item $loader whisper.cpp\build\bin\Release\ -Force

      - name: Ensure the Vulkan loader is beside whisper-cli
        shell: pwsh
        run: |
          $dir = "whisper.cpp\build\bin\Release"
          if (-not (Test-Path (Join-Path $dir "whisper-cli.exe"))) {
            throw "whisper-cli.exe is missing from the build/cache"
          }
          $loader = Join-Path $dir "vulkan-1.dll"
          if (-not (Test-Path $loader)) {
            $candidates = @((Join-Path $env:SystemRoot "System32\vulkan-1.dll"))
            if ($env:VULKAN_SDK) { $candidates += (Join-Path $env:VULKAN_SDK "Bin\vulkan-1.dll") }
            $source = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $source) { throw "vulkan-1.dll was not found; install the Vulkan SDK or check System32" }
            Copy-Item $source $loader -Force
          }

      - name: Verify whisper-cli.exe runs
        shell: pwsh
        run: |
          $bin = "whisper.cpp\build\bin\Release\whisper-cli.exe"
          if (-not (Test-Path $bin)) { throw "whisper-cli.exe was not built" }
          if (-not (Test-Path "whisper.cpp\build\bin\Release\vulkan-1.dll")) {
            throw "vulkan-1.dll is not beside whisper-cli.exe"
          }
          & $bin --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "whisper-cli.exe failed to run" }

      # Control measurement for finding 1: the same model and speech clip,
      # same 4 threads and beam size, on the same runner, with the independent
      # whisper-cli binary and no GPU. If this is also slow, the runner is the
      # limit; if it is fast, the in-process engine is the problem.
      - name: Measure the whisper-cli CPU control
        shell: pwsh
        run: |
          $bin = "whisper.cpp\build\bin\Release\whisper-cli.exe"
          $wav = (Resolve-Path "assets\selftest_speech.wav").Path
          $model = (Resolve-Path "whispercpp\ggml-large-v3-turbo-q5_0.bin").Path
          $out = Join-Path $PWD "control-whisper"
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          & $bin -m $model -f $wav -bs 5 -t 4 -ng -pp --output-json --output-file $out 2> control.err
          $code = $LASTEXITCODE
          $watch.Stop()
          if ($code -ne 0) {
            Get-Content control.err -Tail 20
            throw "The whisper-cli control decode failed (exit $code)"
          }
          $seconds = $watch.Elapsed.TotalSeconds
          Write-Host ("Control whisper-cli CPU decode: {0:N1}s for {1:N1}s of speech" -f $seconds, 23.3)
          Get-Content control.err -Tail 6 | ForEach-Object { Write-Host $_ }
          $budget = [Math]::Min(180.0, [Math]::Max(60.0, [Math]::Round($seconds * 2.0, 0)))
          Write-Host ("Selftest speech budget: {0:N0}s (2x the control, minimum 60s)" -f $budget)
          Add-Content $env:GITHUB_ENV "EASYSCRIBE_SELFTEST_BUDGET_SEC=$budget"

      # Build the app and packer together so both see the static sherpa
      # feature. Linux CI runs the test suite; this job validates the Windows
      # static link and packaging.
      - name: Build the app and packer
        shell: pwsh
        run: |
          # The build scripts do not declare every input as rerun-if-env-changed,
          # so a restored target directory could keep an older CMake
          # configuration. Reconfigure whisper.cpp from scratch.
          if (Test-Path target\release) {
            foreach ($pattern in @("whisper-rs-sys-*", "whisper-rs-*")) {
              Get-ChildItem target\release\build -Directory -Filter $pattern -ErrorAction SilentlyContinue |
                Remove-Item -Recurse -Force
              Get-ChildItem target\release\.fingerprint -Directory -Filter $pattern -ErrorAction SilentlyContinue |
                Remove-Item -Recurse -Force
            }
          }
          cargo build --release -p easyscribe -p easyscribe-pack --no-default-features --features easyscribe/release-static
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          $cache = Get-ChildItem target\release\build -Recurse -Filter CMakeCache.txt -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "whisper-rs-sys" } | Select-Object -First 1
          if (-not $cache) { throw "whisper.cpp CMakeCache.txt was not produced" }
          $lines = Get-Content $cache.FullName
          $lines | Where-Object { $_ -match "^GGML_(NATIVE|AVX|AVX2|FMA|SSE42|OPENMP):|^CMAKE_BUILD_TYPE:" } |
            ForEach-Object { Write-Host $_ }
          foreach ($entry in @("GGML_NATIVE:BOOL=OFF", "GGML_AVX:BOOL=ON", "GGML_AVX2:BOOL=ON")) {
            if (-not ($lines -contains $entry)) { throw "whisper.cpp was not built with $entry" }
          }
          if (-not ($lines | Where-Object { $_ -match '^CMAKE_BUILD_TYPE:(STRING|UNINITIALIZED)=Release$' })) {
            throw "whisper.cpp was not configured with CMAKE_BUILD_TYPE=Release"
          }

      - name: Check the executable starts headlessly
        shell: pwsh
        run: |
          # The raw binary has no payload footer yet. Point it at the checkout
          # so it takes the development path instead of reporting a damaged exe.
          $env:EASYSCRIBE_BASE_DIR = $PWD.Path
          $process = Start-Process -FilePath "target\release\easyscribe.exe" `
            -ArgumentList "--list-scenes" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "easyscribe.exe did not start (exit $($process.ExitCode))" }

      # Keep only the two binaries the packaging steps still need. Removing the
      # multi-gigabyte target directory leaves room for the payload archive and
      # the 1.7 GB output on the runner's ~14 GB disk.
      - name: Keep the built binaries and free the target directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\easyscribe.exe dist\easyscribe-raw.exe
          Copy-Item target\release\easyscribe-pack.exe dist\easyscribe-pack.exe
          Remove-Item target -Recurse -Force
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free | Format-Table

      # Assemble exactly what ships inside the single exe. whisper-cli and its
      # DLLs are the primary file-transcription engine (Vulkan when available,
      # CPU otherwise); the app itself also contains the in-process fallback.
      - name: Assemble the payload
        shell: pwsh
        run: |
          if (Test-Path payload) { Remove-Item payload -Recurse -Force }
          New-Item -ItemType Directory payload | Out-Null
          Copy-Item models payload\models -Recurse
          Copy-Item tools\ffmpeg payload\ffmpeg -Recurse
          New-Item -ItemType Directory payload\whispercpp | Out-Null
          Copy-Item whispercpp\ggml-large-v3-turbo-q5_0.bin payload\whispercpp\
          Copy-Item whisper.cpp\build\bin\Release\whisper-cli.exe payload\whispercpp\
          Copy-Item whisper.cpp\build\bin\Release\*.dll payload\whispercpp\
          # whisper-cli is built with the dynamic MSVC runtime and OpenMP. Put
          # the redistributable DLLs beside it so a clean PC without the VC++
          # redistributable can still run the child process. These four are
          # required: the payload completeness check will reject a cache that
          # lacks any of them and force a re-extract.
          $redist = $env:VCToolsRedistDir
          if (-not $redist) { throw "VCToolsRedistDir is not set" }
          $crt = Get-ChildItem "$redist\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $crt) { throw "The MSVC CRT redistributable folder was not found" }
          Copy-Item "$($crt.FullName)\*.dll" payload\whispercpp\ -Force
          $openmp = Get-ChildItem "$redist\x64\Microsoft.VC*.OpenMP" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $openmp) { throw "The MSVC OpenMP redistributable folder was not found" }
          Copy-Item "$($openmp.FullName)\vcomp140.dll" payload\whispercpp\ -Force
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "vcomp140.dll")) {
            if (-not (Test-Path (Join-Path "payload\whispercpp" $dll))) {
              $system = Join-Path $env:SystemRoot "System32\$dll"
              if (-not (Test-Path $system)) { throw "Missing whisper-cli runtime DLL: $dll" }
              Copy-Item $system "payload\whispercpp\$dll" -Force
            }
          }
          Copy-Item assets payload\assets -Recurse
          Copy-Item licenses payload\licenses -Recurse
          Copy-Item LICENSE payload\LICENSE
          Get-ChildItem payload\whispercpp | Select-Object Name, Length | Format-Table
          $mb = (Get-ChildItem payload -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Payload: {0:N0} MB" -f $mb)

      - name: Verify the whisper-cli payload
        shell: pwsh
        run: |
          $dir = "payload\whispercpp"
          $bin = Join-Path $dir "whisper-cli.exe"
          if (-not (Test-Path $bin)) { throw "whisper-cli.exe is missing from the payload" }
          foreach ($name in @("whisper.dll", "ggml.dll", "ggml-base.dll", "ggml-cpu.dll", "ggml-vulkan.dll", "vulkan-1.dll")) {
            if (-not (Test-Path (Join-Path $dir $name))) { throw "Missing whisper-cli dependency: $name" }
          }
          $deps = (& dumpbin /dependents $bin | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "dumpbin could not read $bin" }
          Write-Host $deps
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "vcomp140.dll")) {
            if (-not (Test-Path (Join-Path $dir $dll))) {
              throw "The payload is missing the whisper-cli runtime DLL: $dll"
            }
          }
          foreach ($exe in @("ffmpeg.exe", "ffprobe.exe")) {
            $path = "payload\ffmpeg\$exe"
            if (-not (Test-Path $path)) { throw "The payload is missing ffmpeg/$exe" }
            & $path -version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$exe failed to run from the payload" }
          }
          # Run it from its payload folder with an empty model; a missing
          # runtime DLL fails here, before the 1.8 GB exe is assembled.
          & $bin -m "" -f "" 2>&1 | Out-Null
          $code = $LASTEXITCODE
          if ($code -eq -1073741515) { throw "whisper-cli could not load a runtime DLL" }
          # Empty paths are expected to make the CLI exit 1; only the loader
          # failure above is meaningful. Do not let that 1 fail the step.
          exit 0

      # The models and ffmpeg now live in payload\. Delete the originals so the
      # runner has room for the 1.7 GB archive temp file and the final exe.
      - name: Free the model staging folders
        shell: pwsh
        run: |
          Remove-Item models, tools\ffmpeg, whispercpp, sherpa-static -Recurse -Force
          # Keep only the built whisper-cli binaries for the cache; the source
          # tree and CMake objects are no longer needed.
          if (Test-Path whisper.cpp) {
            Get-ChildItem whisper.cpp -Force | Where-Object { $_.Name -ne "build" } |
              Remove-Item -Recurse -Force
            Get-ChildItem whisper.cpp\build -Force | Where-Object { $_.Name -ne "bin" } |
              Remove-Item -Recurse -Force
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free | Format-Table

      - name: Append the payload to the executable
        shell: pwsh
        run: |
          $out = "dist\EasyScribe-$env:TAG.exe"
          & "dist\easyscribe-pack.exe" `
            --binary "dist\easyscribe-raw.exe" `
            --payload payload `
            --out $out `
            --version "$env:APP_VERSION" `
            --build-id $env:TAG
          if ($LASTEXITCODE -ne 0) { throw "easyscribe-pack failed" }
          Remove-Item payload, dist\easyscribe-raw.exe, dist\easyscribe-pack.exe -Recurse -Force
          $size = (Get-Item $out).Length / 1MB
          if ($size -gt 1900) { throw "The release exe is too large for a GitHub release asset: $size MB" }
          Write-Host ("Release exe: {0} ({1:N1} MB)" -f $out, $size)

      - name: Verify imports and subsystem
        shell: pwsh
        run: |
          $out = "dist\EasyScribe-$env:TAG.exe"
          $deps = (& dumpbin /dependents $out | Out-String)
          Write-Host $deps
          if ($deps -match '(?i)sherpa|onnxruntime|VCRUNTIME|MSVCP|VULKAN') {
            throw "The exe imports a non-system or non-static-runtime DLL; the single-file requirement is broken."
          }
          if ($deps -notmatch '(?i)KERNEL32\.dll') { throw "dumpbin did not report a valid Windows executable" }
          $headers = (& dumpbin /headers $out | Out-String)
          # dumpbin prints "2 subsystem (Windows GUI)"; keep this tolerant of
          # the parentheses so a correct GUI build is not rejected.
          if ($headers -notmatch '(?is)subsystem.*Windows GUI') {
            throw "The release executable was not linked as a Windows GUI application"
          }
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  EasyScribe-$env:TAG.exe" | Set-Content -Encoding ascii "dist\EasyScribe-$env:TAG.exe.sha256"
          Get-Content "dist\EasyScribe-$env:TAG.exe.sha256"

      - name: Extract the payload and run the native selftest
        shell: pwsh
        env:
          EASYSCRIBE_WHISPER_TRACE: "1"
        run: |
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List
          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize, FreePhysicalMemory | Format-List
          $out = (Resolve-Path "dist\EasyScribe-$env:TAG.exe").Path
          $data = Join-Path $PWD "smoke-data"
          $env:EASYSCRIBE_DATA_DIR = $data
          $first = Start-Process -FilePath $out -ArgumentList "--selftest" `
            -Wait -PassThru -NoNewWindow
          if ($first.ExitCode -ne 0) {
            Get-Content (Join-Path $data "logs\selftest.txt") -ErrorAction SilentlyContinue
            throw "The packed exe failed its native selftest (exit $($first.ExitCode))"
          }
          $runtime = Get-ChildItem "$data\runtime" -Directory | Select-Object -First 1
          if (-not $runtime) { throw "No extracted runtime directory was created" }
          foreach ($rel in @(
            "models\silero_vad.onnx",
            "models\diarization\segmentation.onnx",
            "models\diarization\embedding.onnx",
            "models\whisper\turbo-encoder.int8.onnx",
            "models\whisper\turbo-decoder.int8.onnx",
            "models\whisper\turbo-tokens.txt",
            "ffmpeg\ffmpeg.exe",
            "ffmpeg\ffprobe.exe",
            "whispercpp\ggml-large-v3-turbo-q5_0.bin",
            "whispercpp\whisper-cli.exe",
            "whispercpp\ggml-vulkan.dll",
            "whispercpp\vulkan-1.dll",
            "assets\EasyScribe.ico",
            "assets\selftest_speech.wav",
            "assets\selftest_speech.txt",
            "licenses\THIRD-PARTY-NOTICES.txt",
            "LICENSE"
          )) {
            if (-not (Test-Path (Join-Path $runtime.FullName $rel))) { throw "Missing from the extracted runtime: $rel" }
          }
          $marker = Join-Path $runtime.FullName ".complete"
          $before = (Get-Item $marker).LastWriteTimeUtc
          $second = Start-Process -FilePath $out -ArgumentList "--list-scenes" `
            -Wait -PassThru -NoNewWindow
          if ($second.ExitCode -ne 0) { throw "The cached launch failed (exit $($second.ExitCode))" }
          $after = (Get-Item $marker).LastWriteTimeUtc
          if ($before -ne $after) { throw "The cached launch re-extracted the runtime" }
          Write-Host "Native selftest, extraction and cached launch verified."
          Remove-Item $data -Recurse -Force

      - name: Create the draft pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "EasyScribe ${{ inputs.tag }} — Rust/Rune preview"
          body: |
            ## EasyScribe ${{ inputs.tag }} — Rust/Rune preview

            A feature-parity rebuild of EasyScribe 3.2.3 in Rust with the Rune UI.
            This is a **draft pre-release for testing**, not the stable Python release.

            **One file.** Download `EasyScribe-${{ inputs.tag }}.exe` and double-click it.
            The first launch unpacks the speech models and ffmpeg into
            `%LOCALAPPDATA%\EasyScribe\runtime`; later launches reuse that cache.
            Nothing is installed system-wide, and no account or network connection is used.

            **Size and disk:** the download is about **1.86 GB** and every update is a
            full download of the same size. After the first launch the extracted
            runtime takes about another **1.7 GB**, so a fresh install uses about
            **3.6 GB** in total. Updating an existing copy needs up to about
            **5.3 GB free** temporarily while the old and new runtimes coexist;
            the old runtime is removed after the new version starts. The app
            checks free space before unpacking and shows a clear message instead
            of failing halfway.

            **Requirements:** 64-bit Windows 10 or 11 on an x86-64 CPU with
            **AVX2, FMA, F16C and BMI2**. File transcription uses the bundled
            whisper.cpp Vulkan build when a GPU driver is available, and retries
            on the CPU automatically when it is not. The CPU path is slower than
            the Python release's GPU path but produces the same transcript.

            ### What to test
            - Transcribe audio/video files, including drag and drop and Stop.
            - Record with **Best quality transcript after recording** and **Show words as I speak**.
            - Find speakers, name them, and rename recordings/transcripts.
            - Privacy, Show details, changing folders, and small-window layouts.

            ### Notes
            - Windows may show SmartScreen because the exe is unsigned. Choose
              **More info → Run anyway**.
            - The app is fully offline. ffmpeg is restricted to local files.
            - Temporary audio is deleted after each file and again on exit.
            - **Licensing:** EasyScribe is MIT, but the bundled sherpa-onnx
              static build includes GPL-3.0 `espeak-ng`. This draft is for
              testing; the combined-work license decision is pending. See
              `licenses/THIRD-PARTY-NOTICES.txt` in the runtime.

            Windows build: ${{ steps.revision.outputs.sha }}
          files: |
            dist/EasyScribe-${{ inputs.tag }}.exe
            dist/EasyScribe-${{ inputs.tag }}.exe.sha256
          target_commitish: ${{ steps.revision.outputs.sha }}
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
