name: Rune Windows Release

# This default-branch copy exists only so GitHub shows the workflow in the
# Actions tab. The real release pipeline lives on `rune-rewrite` and must be
# dispatched from that ref:
#
#   gh workflow run rune-release.yml --ref rune-rewrite -f tag=v3.2.3-rust.N
#
# Running the workflow at `main` would use this stub, not the real pipeline.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must contain a hyphen), e.g. v3.2.3-rust.1'
        required: true
        default: 'v3.2.3-rust.1'

permissions:
  contents: read

jobs:
  wrong-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to build from main
        run: |
          echo "::error::Dispatch the Rune release from the rune-rewrite branch."
          echo "gh workflow run rune-release.yml --ref rune-rewrite -f tag=${{ inputs.tag }}"
          exit 1
