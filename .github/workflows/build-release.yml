name: Build and Publish Release

# Trigger manually from the GitHub Actions tab.
# Provide a tag — a GitHub Release (draft) is created automatically.
#
# Two ZIP assets are published per release (both under GitHub's 2 GB limit):
#   - EasyScribe-<tag>-app.zip    (~1.1 GB) — exe + nvidia CUDA DLLs + ffmpeg
#   - EasyScribe-<tag>-model.zip  (~1.5 GB) — Whisper model + diarization models
#
# First-time install: extract both ZIPs into the same folder.
# App updates:        re-extract app.zip only (model folder is unchanged).
#
# Cache strategy (skips re-downloading on repeat builds):
#   ffmpeg              ~70 MB    key: ffmpeg-win64-gpl-static-v1
#   venv                ~2-3 GB   key: venv-win64-py3.11-v6              (bump to refresh)
#   whisper model       ~1.5 GB   key: faster-whisper-large-v3-turbo-mobiuslabs-v1
#   diarization models  ~35 MB    key: sherpa-onnx-diarization-v1
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      cuda:
        description: 'Bundle GPU-capable sherpa-onnx (CUDA provider) for speaker diarization'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # required to create releases and upload assets

jobs:
  build:
    name: Build portable Windows release
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Cache ffmpeg (~70 MB, rarely changes) ──────────────────────────────
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: tools\ffmpeg
          key: ffmpeg-win64-gpl-static-v1

      # ── 3b. Download ffmpeg (skipped on cache hit) ────────────────────────────
      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "Downloading ffmpeg..."
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          New-Item -ItemType Directory -Force -Path tools\ffmpeg | Out-Null
          $binFile = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $binDir  = $binFile.DirectoryName
          Copy-Item "$binDir\ffmpeg.exe"  tools\ffmpeg\ffmpeg.exe
          Copy-Item "$binDir\ffprobe.exe" tools\ffmpeg\ffprobe.exe
          Remove-Item ffmpeg_tmp -Recurse -Force
          Remove-Item ffmpeg.zip -Force
          Write-Host "ffmpeg ready."

      # ── 4. Cache model (~1.5 GB, content never changes) ──────────────────────
      - name: Cache Faster Whisper model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/faster-whisper-large-v3-turbo
          key: faster-whisper-large-v3-turbo-mobiuslabs-v1

      # ── 4b. Download model from HuggingFace (skipped on cache hit) ────────────
      - name: Download Faster Whisper model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --quiet

          $script = @"
          import os
          from huggingface_hub import snapshot_download
          token = os.environ.get('HF_TOKEN') or None
          local_dir = 'models/faster-whisper-large-v3-turbo'
          print(f'Downloading model to {local_dir} ...')
          snapshot_download(
              repo_id='mobiuslabsgmbh/faster-whisper-large-v3-turbo',
              local_dir=local_dir,
              ignore_patterns=['*.gitattributes', '*.md', '.git*', '*.gitignore'],
              token=token,
          )
          print('Model download complete.')
          "@

          $script | python

      # ── 5. Cache Python venv (~1-1.5 GB) ──────────────────────────────────────
      # sherpa-onnx (CPU or CUDA-provider) + nvidia-*-cu12 packages for CUDA DLLs.
      # Bump v6 → v7 (etc.) to force a clean reinstall (e.g. after adding a package).
      - name: Cache Python venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: venv
          key: venv-win64-py3.11-v6-cuda${{ inputs.cuda }}

      # ── 5b. Install Python dependencies (skipped on cache hit) ───────────────
      - name: Install Python dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv venv
          & venv\Scripts\Activate.ps1

          python -m pip install --upgrade pip --quiet

          # Separate nvidia CUDA 12 packages — provide cublas/cudart/cudnn DLLs
          # that ctranslate2 needs for GPU transcription inference.
          # hook-nvidia.py collects these into nvidia/<pkg>/bin/ in the bundle;
          # cuda_setup.py calls os.add_dll_directory() on them at startup.
          Write-Host "Installing nvidia CUDA 12 runtime packages..."
          pip install `
            nvidia-cublas-cu12 `
            nvidia-cuda-runtime-cu12 `
            nvidia-cudnn-cu12 `
            nvidia-cuda-nvrtc-cu12 `
            --quiet

          if ("${{ inputs.cuda }}" -eq "true") {
            Write-Host "Installing sherpa-onnx (CUDA provider) for GPU diarization..."
            pip install sherpa-onnx --pre -f https://k2-fsa.github.io/sherpa/onnx/cuda.html --quiet
          } else {
            Write-Host "Installing sherpa-onnx (CPU)..."
            pip install sherpa-onnx --quiet
          }

          Write-Host "Installing core dependencies..."
          pip install faster-whisper customtkinter tkinterdnd2 pyinstaller --quiet

          Write-Host "Installed packages:"
          pip list --format=columns

      # ── 6. Build with PyInstaller ─────────────────────────────────────────────
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          & venv\Scripts\Activate.ps1
          pyinstaller EasyScribe.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          Write-Host "PyInstaller build complete."

      # ── 6b. Cache diarization models (~35 MB) ────────────────────────────────
      - name: Cache diarization models
        id: diarization-cache
        uses: actions/cache@v4
        with:
          path: models/diarization
          key: sherpa-onnx-diarization-v1

      # ── 6c. Download diarization models (skipped on cache hit) ───────────────
      # Public sherpa-onnx GitHub release assets — no authentication required
      # (unlike the gated pyannote HF repos this replaces).
      #   - segmentation: ONNX export of pyannote/segmentation-3.0
      #   - embedding:    WeSpeaker ResNet34-LM (same model family used previously)
      - name: Download diarization models
        if: steps.diarization-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "models/diarization" | Out-Null

          Write-Host "Downloading segmentation model..."
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2" -OutFile "segmentation.tar.bz2"
          tar xjf segmentation.tar.bz2
          Move-Item -Force "sherpa-onnx-pyannote-segmentation-3-0/model.onnx" "models/diarization/segmentation.onnx"
          Remove-Item -Recurse -Force "sherpa-onnx-pyannote-segmentation-3-0", "segmentation.tar.bz2"

          Write-Host "Downloading embedding model..."
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx" -OutFile "models/diarization/embedding.onnx"

          Write-Host "Diarization models downloaded."

      # ── 6d. Verify diarization model cache ────────────────────────────────────
      - name: Verify diarization model cache
        shell: pwsh
        run: |
          $verifyScript = @"
          import sys
          from pathlib import Path

          d = Path('models/diarization')
          ok = True
          for name in ('segmentation.onnx', 'embedding.onnx'):
              f = d / name
              if not f.is_file():
                  print(f'FAIL: missing {f}')
                  ok = False
              else:
                  print(f'OK  {f} ({f.stat().st_size / 1e6:.1f} MB)')

          if not ok:
              sys.exit(1)
          print('Diarization model verification PASSED')
          "@
          $verifyScript | venv\Scripts\python.exe

      # ── 7. Assemble portable app folder (no model) ────────────────────────────
      - name: Assemble EasyScribe folder
        shell: pwsh
        run: |
          $dist = "dist\EasyScribe"

          # Copy ffmpeg
          $ffmpegDst = "$dist\ffmpeg"
          New-Item -ItemType Directory -Force -Path $ffmpegDst | Out-Null
          Copy-Item "tools\ffmpeg\*" $ffmpegDst -Force

          # Create runtime dirs
          New-Item -ItemType Directory -Force -Path "$dist\logs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist\temp" | Out-Null

          # Placeholder so users know where to put the models
          New-Item -ItemType Directory -Force -Path "$dist\models\faster-whisper-large-v3-turbo" | Out-Null
          $placeholder = "Extract EasyScribe-*-model.zip into this same folder to install the Whisper and speaker diarization models."
          Set-Content -Path "$dist\models\EXTRACT_MODEL_ZIP_HERE.txt" -Value $placeholder -Encoding utf8

          # Summary
          $totalMB = (Get-ChildItem $dist -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "App folder size: $([math]::Round($totalMB, 0)) MB"
          Get-ChildItem $dist | Select-Object Name

      # ── 8. Create release ZIPs ────────────────────────────────────────────────
      - name: Create release ZIPs
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"

          # ── ZIP 1: app only (exe + CUDA DLLs + ffmpeg, no model) ─────────────
          $zipApp = "EasyScribe-${tag}-app.zip"
          Write-Host "Creating $zipApp ..."
          Compress-Archive -Path "dist\EasyScribe\*" -DestinationPath $zipApp -CompressionLevel Optimal
          $sz1 = [math]::Round((Get-Item $zipApp).Length / 1MB, 1)
          Write-Host "  Size: ${sz1} MB"

          # ── ZIP 2: model only ─────────────────────────────────────────────────
          # Zipped as models\* so extracting into the same folder as app.zip
          # drops files in exactly the right place:
          #   models\faster-whisper-large-v3-turbo\     — Whisper model
          #   models\diarization\                       — speaker diarization models
          $zipModel = "EasyScribe-${tag}-model.zip"
          Write-Host "Creating $zipModel ..."
          Compress-Archive -Path "models" -DestinationPath $zipModel -CompressionLevel Optimal
          $sz2 = [math]::Round((Get-Item $zipModel).Length / 1MB, 1)
          Write-Host "  Size: ${sz2} MB"

      # ── 9. Publish GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "EasyScribe ${{ github.event.inputs.tag }}"
          body: |
            ## EasyScribe — Portable Offline Speech-to-Text

            Two downloads — both required for a first-time install:

            | Asset | Size | Contents |
            |---|---|---|
            | `...-app.zip` | ~1.1 GB | Exe + CUDA 12 DLLs + ffmpeg (re-download on updates) |
            | `...-model.zip` | ~1.6 GB | Whisper model + speaker diarization models (download once) |

            ---

            ### First-time install
            1. Download both ZIPs
            2. Create a folder anywhere (Desktop, USB stick, etc.)
            3. Extract **app.zip** into that folder
            4. Extract **model.zip** into the **same folder** — the `models\` directory will merge automatically
            5. Double-click **EasyScribe.exe**

            ### Updating the app
            Only re-download and re-extract `...-app.zip` — your model folder stays untouched.

            ---

            ### What's new in v1.0.0

            **Speaker identification** — working end-to-end with pyannote.audio 4.x:
            - Tick **Identify speakers** to detect and label each speaker in the transcript
            - After diarization completes, a popup lets you name each speaker — play a short audio sample to identify who is speaking, then type their name
            - Names replace generic labels (`Speaker 1`, `Speaker 2`, …) in the output file

            **Improved timestamps**
            - Segments are now grouped into natural-pause blocks (~2 s gap threshold)
            - Each block gets a single `[HH:MM:SS]` header instead of a timestamp on every line
            - With speakers + timestamps: `[00:01:23] [Alice]` header at every speaker change or lull

            **Supported input formats**
            mp4, mkv, mov, avi, webm, mp3, wav, m4a, flac, ogg, opus, aac

            ---

            ### GPU acceleration
            NVIDIA GPU is used automatically — CUDA 12 runtime DLLs (cublas, cudart, cudnn) are bundled.
            Falls back to CPU if no compatible GPU is found.

            ### First launch note
            Windows Defender SmartScreen may show **"Windows protected your PC"** — click **More info → Run anyway**.
            This is expected for unsigned PyInstaller executables.
          files: |
            EasyScribe-${{ github.event.inputs.tag }}-app.zip
            EasyScribe-${{ github.event.inputs.tag }}-model.zip
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
