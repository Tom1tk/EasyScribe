name: Build and Publish Release

# Trigger manually from the GitHub Actions tab.
# Builds TWO variants (whisper + parakeet) as parallel matrix jobs.
# Each produces a single self-extracting .exe via 7-zip SFX.
#
# Cache strategy:
#   ffmpeg              ~70 MB    key: ffmpeg-win64-gpl-static-v1        (shared)
#   Python venv         ~1-2 GB   key: venv-win64-py3.11-v2              (shared — no variant suffix)
#   Whisper ONNX model  ~600 MB   key: sherpa-onnx-whisper-distil-large-v3-v1 (whisper only)
#   Parakeet TDT model  ~600 MB   key: sherpa-onnx-parakeet-tdt-0.6b-v3-v1   (parakeet only)
#   Silero VAD model    ~1 MB     key: sherpa-onnx-silero-vad-v1         (shared)
#   Diarization models  ~35 MB    key: sherpa-onnx-diarization-v1        (shared, reuse from v1.x)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.variant }} variant
    runs-on: windows-latest

    strategy:
      matrix:
        variant: [whisper, parakeet]
      fail-fast: false

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. ffmpeg cache (~70 MB) ──────────────────────────────────────────────
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: tools\ffmpeg
          key: ffmpeg-win64-gpl-static-v1

      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          New-Item -ItemType Directory -Force -Path tools\ffmpeg | Out-Null
          $bin = (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item "$bin\ffmpeg.exe"  tools\ffmpeg\ffmpeg.exe
          Copy-Item "$bin\ffprobe.exe" tools\ffmpeg\ffprobe.exe
          Remove-Item ffmpeg_tmp, ffmpeg.zip -Recurse -Force
          Write-Host "ffmpeg ready."

      # ── 4. Python venv cache (~1-2 GB, shared across both variants) ───────────
      # No variant suffix — second job always hits the cache.
      - name: Cache Python venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: venv
          key: venv-win64-py3.11-v2

      - name: Install Python dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv venv
          & venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip --quiet
          pip install sherpa-onnx sounddevice customtkinter tkinterdnd2 pyinstaller --quiet
          Write-Host "Installed packages:"
          pip list --format=columns

      # ── 5. ASR model cache (variant-specific) ─────────────────────────────────
      - name: Cache Whisper ONNX model
        if: matrix.variant == 'whisper'
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: models\whisper
          key: sherpa-onnx-whisper-distil-large-v3-v1

      - name: Download Whisper ONNX model
        if: matrix.variant == 'whisper' && steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "models\whisper" | Out-Null
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-distil-large-v3.tar.bz2"
          Write-Host "Downloading Whisper distil-large-v3..."
          Invoke-WebRequest -Uri $url -OutFile whisper.tar.bz2
          tar xjf whisper.tar.bz2
          Copy-Item "sherpa-onnx-whisper-distil-large-v3\distil-large-v3-encoder.int8.onnx" "models\whisper\"
          Copy-Item "sherpa-onnx-whisper-distil-large-v3\distil-large-v3-decoder.int8.onnx" "models\whisper\"
          Copy-Item "sherpa-onnx-whisper-distil-large-v3\distil-large-v3-tokens.txt"         "models\whisper\"
          Remove-Item "sherpa-onnx-whisper-distil-large-v3", "whisper.tar.bz2" -Recurse -Force
          Write-Host "Whisper model ready."

      - name: Cache Parakeet TDT model
        if: matrix.variant == 'parakeet'
        id: parakeet-cache
        uses: actions/cache@v4
        with:
          path: models\parakeet
          key: sherpa-onnx-parakeet-tdt-0.6b-v3-v1

      - name: Download Parakeet TDT model
        if: matrix.variant == 'parakeet' && steps.parakeet-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "models\parakeet" | Out-Null
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8.tar.bz2"
          Write-Host "Downloading Parakeet TDT 0.6B v3 int8..."
          Invoke-WebRequest -Uri $url -OutFile parakeet.tar.bz2
          tar xjf parakeet.tar.bz2
          $extracted = Get-ChildItem -Directory | Where-Object { $_.Name -like "*parakeet*" } | Select-Object -First 1
          Get-ChildItem $extracted.FullName | Copy-Item -Destination "models\parakeet\"
          Remove-Item $extracted.FullName, "parakeet.tar.bz2" -Recurse -Force
          Write-Host "Parakeet model ready."
          Get-ChildItem "models\parakeet"

      # ── 6. Silero VAD model cache (shared) ────────────────────────────────────
      - name: Cache Silero VAD model
        id: vad-cache
        uses: actions/cache@v4
        with:
          path: models\silero_vad.onnx
          key: sherpa-onnx-silero-vad-v1

      - name: Download Silero VAD model
        if: steps.vad-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "models" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx" -OutFile "models\silero_vad.onnx"
          Write-Host "Silero VAD model ready."

      # ── 7. Diarization models cache (shared, reuse from v1.x) ─────────────────
      - name: Cache diarization models
        id: diarization-cache
        uses: actions/cache@v4
        with:
          path: models\diarization
          key: sherpa-onnx-diarization-v1

      - name: Download diarization models
        if: steps.diarization-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "models\diarization" | Out-Null

          Write-Host "Downloading segmentation model..."
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2" -OutFile "segmentation.tar.bz2"
          tar xjf segmentation.tar.bz2
          Move-Item -Force "sherpa-onnx-pyannote-segmentation-3-0\model.onnx" "models\diarization\segmentation.onnx"
          Remove-Item "sherpa-onnx-pyannote-segmentation-3-0", "segmentation.tar.bz2" -Recurse -Force

          Write-Host "Downloading embedding model..."
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx" -OutFile "models\diarization\embedding.onnx"
          Write-Host "Diarization models ready."

      # ── 8. Bake variant.json ──────────────────────────────────────────────────
      - name: Write models/variant.json
        shell: pwsh
        run: |
          '{"variant": "${{ matrix.variant }}"}' | Set-Content -Path "models\variant.json" -Encoding utf8NoBOM
          Write-Host "variant.json: $(Get-Content models\variant.json)"

      # ── 9. Build main EasyScribe app ──────────────────────────────────────────
      - name: Build EasyScribe (${{ matrix.variant }})
        shell: pwsh
        run: |
          & venv\Scripts\Activate.ps1
          pyinstaller EasyScribe_${{ matrix.variant }}.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          Write-Host "PyInstaller build complete."

      # ── 10. Assemble dist/EasyScribe with models + ffmpeg ─────────────────────
      - name: Assemble app bundle contents
        shell: pwsh
        run: |
          $dist = "dist\EasyScribe"

          # ffmpeg
          New-Item -ItemType Directory -Force -Path "$dist\ffmpeg" | Out-Null
          Copy-Item "tools\ffmpeg\*" "$dist\ffmpeg" -Force

          # Models (variant-specific + shared)
          New-Item -ItemType Directory -Force -Path "$dist\models" | Out-Null
          Copy-Item "models\variant.json"    "$dist\models\variant.json"
          Copy-Item "models\silero_vad.onnx" "$dist\models\silero_vad.onnx"

          if ("${{ matrix.variant }}" -eq "whisper") {
            Copy-Item "models\whisper" "$dist\models\whisper" -Recurse -Force
          } else {
            Copy-Item "models\parakeet" "$dist\models\parakeet" -Recurse -Force
          }

          Copy-Item "models\diarization" "$dist\models\diarization" -Recurse -Force

          # Pre-create recordings dir so it is visible after extraction
          New-Item -ItemType Directory -Force -Path "$dist\recordings" | Out-Null

          $totalMB = (Get-ChildItem $dist -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "App folder size: $([math]::Round($totalMB, 0)) MB"

      # ── 11. Create app.bundle (must exist before building launcher) ───────────
      - name: Create app.bundle
        shell: pwsh
        run: |
          Write-Host "Compressing app.bundle..."
          Compress-Archive -Path "dist\EasyScribe\*" -DestinationPath "app.bundle" -CompressionLevel Optimal
          $sizeMB = [math]::Round((Get-Item app.bundle).Length / 1MB, 1)
          Write-Host "app.bundle: $sizeMB MB"

      # ── 12. Build launcher.exe (embeds app.bundle as data file) ──────────────
      - name: Build launcher.exe
        shell: pwsh
        run: |
          & venv\Scripts\Activate.ps1
          pyinstaller launcher/launcher.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "launcher build failed" }
          $sizeMB = [math]::Round((Get-Item dist\launcher.exe).Length / 1MB, 1)
          Write-Host "launcher.exe (with embedded app.bundle): $sizeMB MB"

      # ── 13. Rename to final release artifact ──────────────────────────────────
      - name: Rename to release artifact
        shell: pwsh
        run: |
          $tag     = "${{ github.event.inputs.tag }}"
          $variant = "${{ matrix.variant }}"
          $outExe  = "EasyScribe-${tag}-${variant}.exe"
          Move-Item "dist\launcher.exe" $outExe
          $sizeMB = [math]::Round((Get-Item $outExe).Length / 1MB, 1)
          Write-Host "Release artifact: $outExe ($sizeMB MB)"

      # ── 14. Publish GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release (${{ matrix.variant }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "EasyScribe ${{ github.event.inputs.tag }}"
          body: |
            ## EasyScribe ${{ github.event.inputs.tag }} — Portable Offline Speech-to-Text

            **Portable — no install required, no admin needed.**
            Place the .exe anywhere (USB stick, shared folder, local drive) and double-click.
            On first run it extracts an `EasyScribe/` folder next to itself and launches.
            On subsequent runs it detects the existing folder and launches immediately.

            | Asset | Model | Description |
            |---|---|---|
            | `...-whisper.exe` | Whisper ONNX distil-large-v3 | Best accuracy |
            | `...-parakeet.exe` | Parakeet TDT 0.6B v3 | Faster inference |

            ### First run
            1. Download one of the .exe files above
            2. Place it wherever you want the app to live
            3. Double-click — extraction takes ~30 seconds, then EasyScribe launches
            4. Transcripts and recordings are saved to `EasyScribe\recordings\` next to the exe

            ### Re-running
            Double-click the same .exe — detects existing `EasyScribe\` folder and launches in ~1 second.

            ### GPU acceleration
            Vulkan GPU provider is used automatically when a compatible GPU driver is installed.
            Falls back to CPU if no GPU is detected.

            ### SmartScreen
            Windows Defender SmartScreen may show **"Windows protected your PC"** — click
            **More info → Run anyway**. Expected for unsigned executables.

            ---
            ### What's new in v2.0.0
            - **Fully portable** — installs next to the .exe, works from USB, no AppData, no admin
            - **sherpa-onnx** replaces faster-whisper — no CUDA DLL headaches
            - **Vulkan GPU** acceleration — works on any GPU (NVIDIA, AMD, Intel)
            - **Live microphone transcription** — click Record, speak, get text
            - **Two model variants** — Whisper ONNX (accurate) or Parakeet TDT (fast)
            - **Crash-safe recording** — interrupted recordings are recoverable on next launch
          files: EasyScribe-${{ github.event.inputs.tag }}-${{ matrix.variant }}.exe
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
