name: Build and Publish Release

# Trigger manually from the GitHub Actions tab.
# Builds a single EasyScribe .exe via 7-zip SFX (Whisper ONNX large-v3-turbo).
#
# Cache strategy:
#   ffmpeg              ~150 MB   key: ffmpeg-win64-gpl-n7.1.4-v1
#   Python venv         ~1-2 GB   key: venv-win64-py3.11-v3
#   Whisper ONNX model  ~1 GB     key: sherpa-onnx-whisper-turbo-v1
#   Silero VAD model    ~1 MB     key: sherpa-onnx-silero-vad-v1
#   Diarization models  ~35 MB    key: sherpa-onnx-diarization-v1        (reuse from v1.x)
#   whisper.cpp Vulkan  ~50 MB    key: whispercpp-vulkan-v1.8.6-vksdk1.4.313.2-v1
#                                 (whisper-cli.exe + DLLs; Vulkan SDK install + shader
#                                 build only run on cache miss — see step 7b)
#   whisper.cpp model   ~547 MB   key: ggml-large-v3-turbo-q5_0-v1

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build EasyScribe
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. ffmpeg cache (~150 MB) ─────────────────────────────────────────────
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: tools\ffmpeg
          key: ffmpeg-win64-gpl-n7.1.4-v1

      # Pinned to a dated BtbN/FFmpeg-Builds release (not "latest", which is a
      # mutable rolling tag) so builds are reproducible. To bump: pick a new
      # autobuild-YYYY-MM-DD-... tag from
      # https://github.com/BtbN/FFmpeg-Builds/releases, find its win64-gpl
      # asset filename (it embeds the ffmpeg version + commit hash and
      # changes every release), and update both the URL and the cache key.
      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-11-14-22/ffmpeg-n7.1.4-39-ga5faeca88f-win64-gpl-7.1.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          New-Item -ItemType Directory -Force -Path tools\ffmpeg | Out-Null
          $bin = (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item "$bin\ffmpeg.exe"  tools\ffmpeg\ffmpeg.exe
          Copy-Item "$bin\ffprobe.exe" tools\ffmpeg\ffprobe.exe
          Remove-Item ffmpeg_tmp, ffmpeg.zip -Recurse -Force
          Write-Host "ffmpeg ready."

      # ── 4. Python venv cache (~1-2 GB) ────────────────────────────────────────
      - name: Cache Python venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: venv
          key: venv-win64-py3.11-v3

      - name: Install Python dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv venv
          & venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip --quiet
          pip install sherpa-onnx sounddevice numpy customtkinter tkinterdnd2 pyinstaller --quiet
          Write-Host "Installed packages:"
          pip list --format=columns

      # ── 4b. API smoke tests — catch sherpa_onnx signature mismatches ──────────
      # Fast, offline, no model files needed. Runs before the slow model
      # downloads and PyInstaller build so bad API calls fail in seconds.
      - name: Run sherpa_onnx API tests
        shell: pwsh
        run: |
          & venv\Scripts\Activate.ps1
          python tests/test_sherpa_api.py
          if ($LASTEXITCODE -ne 0) { throw "API smoke tests failed — see output above" }

      # ── 4c. All fast unit tests — VAD bounds, transcript builders, recovery,
      # launcher safety, live transcriber. Pure-Python, milliseconds each, no
      # model files needed. Same fail-fast placement as 4b.
      - name: Run all unit tests
        shell: pwsh
        run: |
          & venv\Scripts\Activate.ps1
          python tests/run_all.py
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed — see output above" }

      # ── 5. Whisper ONNX model cache (~1 GB) ───────────────────────────────────
      - name: Cache Whisper ONNX model
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: models\whisper
          key: sherpa-onnx-whisper-turbo-v1

      - name: Download Whisper ONNX model
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "models\whisper" | Out-Null
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-turbo.tar.bz2"
          Write-Host "Downloading Whisper large-v3-turbo..."
          Invoke-WebRequest -Uri $url -OutFile whisper.tar.bz2
          tar xjf whisper.tar.bz2
          Copy-Item "sherpa-onnx-whisper-turbo\turbo-encoder.int8.onnx" "models\whisper\"
          Copy-Item "sherpa-onnx-whisper-turbo\turbo-decoder.int8.onnx" "models\whisper\"
          Copy-Item "sherpa-onnx-whisper-turbo\turbo-tokens.txt"        "models\whisper\"
          Remove-Item "sherpa-onnx-whisper-turbo", "whisper.tar.bz2" -Recurse -Force
          Write-Host "Whisper model ready."

      # ── 6. Silero VAD model cache (shared) ────────────────────────────────────
      - name: Cache Silero VAD model
        id: vad-cache
        uses: actions/cache@v4
        with:
          path: models\silero_vad.onnx
          key: sherpa-onnx-silero-vad-v1

      - name: Download Silero VAD model
        if: steps.vad-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "models" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx" -OutFile "models\silero_vad.onnx"
          Write-Host "Silero VAD model ready."

      # ── 7. Diarization models cache (shared, reuse from v1.x) ─────────────────
      - name: Cache diarization models
        id: diarization-cache
        uses: actions/cache@v4
        with:
          path: models\diarization
          key: sherpa-onnx-diarization-v1

      - name: Download diarization models
        if: steps.diarization-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "models\diarization" | Out-Null

          Write-Host "Downloading segmentation model..."
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2" -OutFile "segmentation.tar.bz2"
          tar xjf segmentation.tar.bz2
          Move-Item -Force "sherpa-onnx-pyannote-segmentation-3-0\model.onnx" "models\diarization\segmentation.onnx"
          Remove-Item "sherpa-onnx-pyannote-segmentation-3-0", "segmentation.tar.bz2" -Recurse -Force

          Write-Host "Downloading embedding model..."
          # NOTE: "recongition" typo is upstream's actual release tag; do not "fix"
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx" -OutFile "models\diarization\embedding.onnx"
          Write-Host "Diarization models ready."

      # ── 7b. whisper.cpp Vulkan build (whisper-cli.exe — file transcription
      # engine, see src/whispercpp_wrapper.py and CLAUDE.md Phase 8). Built
      # from source because official whisper.cpp Windows release zips are
      # CPU/CUDA only (ggml-org/whisper.cpp#3673) — Vulkan runs on any GPU
      # vendor. Cached so the Vulkan SDK install + shader build only happen
      # once; pinned to release tag v1.8.6 (supply-chain: never build master).
      - name: Cache whisper.cpp Vulkan build
        id: whispercpp-cache
        uses: actions/cache@v4
        with:
          path: whisper.cpp\build\bin\Release
          key: whispercpp-vulkan-v1.8.6-vksdk1.4.313.2-v1

      # Vulkan SDK is build-time only (provides vulkan.h / vulkan-1.lib / glslc
      # for shader compilation). At runtime whisper-cli.exe only needs the
      # user's GPU driver (vulkan-1.dll) — nothing from the SDK is bundled.
      - name: Install Vulkan SDK
        if: steps.whispercpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = "1.4.313.2"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile VulkanSDK.exe
          & .\VulkanSDK.exe --accept-licenses --default-answer --confirm-command install
          Remove-Item VulkanSDK.exe
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$ver"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$ver\Bin"

      - name: Build whisper-cli.exe (Vulkan)
        if: steps.whispercpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --branch v1.8.6 --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp\build -A x64 `
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DWHISPER_SDL2=OFF
          cmake --build whisper.cpp\build --config Release --target whisper-cli --parallel
          if ($LASTEXITCODE -ne 0) { throw "whisper.cpp build failed" }

      - name: Verify whisper-cli.exe runs
        shell: pwsh
        run: |
          & "whisper.cpp\build\bin\Release\whisper-cli.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "whisper-cli.exe failed to run" }

      # ── 7c. whisper.cpp GGUF model (~547 MB, large-v3-turbo q5_0 — see
      # EASYSCRIBE_ACTION_PLAN.md Phase 8.1 checkpoint ① accuracy A/B) ──────────
      - name: Cache whisper.cpp GGUF model
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: models\ggml-large-v3-turbo-q5_0.bin
          key: ggml-large-v3-turbo-q5_0-v1

      - name: Download whisper.cpp GGUF model
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "models" | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin" -OutFile "models\ggml-large-v3-turbo-q5_0.bin"
          Write-Host "GGUF model ready."

      # ── 8. Diagnose sounddevice package layout ────────────────────────────────
      - name: Diagnose sounddevice layout
        shell: pwsh
        run: |
          & venv\Scripts\Activate.ps1
          python tests/diagnose_sounddevice.py

      # ── 9. Build main EasyScribe app ──────────────────────────────────────────
      - name: Build EasyScribe
        shell: pwsh
        run: |
          & venv\Scripts\Activate.ps1
          pyinstaller EasyScribe_whisper.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          Write-Host "PyInstaller build complete."

      # ── 10. Validate build — catch missing packages before the compress step ──
      - name: Validate build
        shell: pwsh
        run: |
          & venv\Scripts\Activate.ps1
          python tests/validate_build.py dist\EasyScribe
          if ($LASTEXITCODE -ne 0) { throw "Build validation failed — see output above" }

      # ── 11. Assemble dist/EasyScribe with models + ffmpeg ─────────────────────
      - name: Assemble app bundle contents
        shell: pwsh
        run: |
          $dist = "dist\EasyScribe"

          # ffmpeg
          New-Item -ItemType Directory -Force -Path "$dist\ffmpeg" | Out-Null
          Copy-Item "tools\ffmpeg\*" "$dist\ffmpeg" -Force

          # Models
          New-Item -ItemType Directory -Force -Path "$dist\models" | Out-Null
          Copy-Item "models\silero_vad.onnx" "$dist\models\silero_vad.onnx"
          Copy-Item "models\whisper" "$dist\models\whisper" -Recurse -Force
          Copy-Item "models\diarization" "$dist\models\diarization" -Recurse -Force

          # whisper.cpp (Vulkan file-transcription engine — optional; falls
          # back to sherpa-onnx if missing, see src/whispercpp_wrapper.py)
          New-Item -ItemType Directory -Force -Path "$dist\whispercpp" | Out-Null
          Copy-Item "whisper.cpp\build\bin\Release\whisper-cli.exe" "$dist\whispercpp\"
          Copy-Item "whisper.cpp\build\bin\Release\*.dll" "$dist\whispercpp\" -ErrorAction SilentlyContinue
          Copy-Item "models\ggml-large-v3-turbo-q5_0.bin" "$dist\whispercpp\"

          # Pre-create recordings dir so it is visible after extraction
          New-Item -ItemType Directory -Force -Path "$dist\recordings" | Out-Null

          $totalMB = (Get-ChildItem $dist -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "App folder size: $([math]::Round($totalMB, 0)) MB"

      # ── 12. Create app.bundle (must exist before building launcher) ───────────
      - name: Create app.bundle
        shell: pwsh
        run: |
          Write-Host "Compressing app.bundle..."
          Compress-Archive -Path "dist\EasyScribe\*" -DestinationPath "app.bundle" -CompressionLevel Optimal
          $sizeMB = [math]::Round((Get-Item app.bundle).Length / 1MB, 1)
          Write-Host "app.bundle: $sizeMB MB"

      # ── 13. Build launcher.exe (embeds app.bundle as data file) ──────────────
      - name: Build launcher.exe
        shell: pwsh
        run: |
          & venv\Scripts\Activate.ps1
          pyinstaller launcher/launcher.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "launcher build failed" }
          $sizeMB = [math]::Round((Get-Item dist\launcher.exe).Length / 1MB, 1)
          Write-Host "launcher.exe (with embedded app.bundle): $sizeMB MB"

      # ── 14. Rename to final release artifact ──────────────────────────────────
      - name: Rename to release artifact
        shell: pwsh
        run: |
          $tag    = "${{ github.event.inputs.tag }}"
          $outExe = "EasyScribe-${tag}-whisper.exe"
          Move-Item "dist\launcher.exe" $outExe
          $sizeMB = [math]::Round((Get-Item $outExe).Length / 1MB, 1)
          Write-Host "Release artifact: $outExe ($sizeMB MB)"

      # ── 15. Publish GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "EasyScribe ${{ github.event.inputs.tag }}"
          body: |
            ## EasyScribe ${{ github.event.inputs.tag }} — Portable Offline Speech-to-Text

            **Portable — no install required, no admin needed.**
            Place the .exe anywhere (USB stick, shared folder, local drive) and double-click.
            On first run it extracts an `EasyScribe/` folder next to itself and launches.
            On subsequent runs it detects the existing folder and launches immediately.

            | Asset | Model | Description |
            |---|---|---|
            | `...-whisper.exe` | Whisper ONNX large-v3-turbo | Offline transcription with speaker identification |

            ### First run
            1. Download the .exe file above
            2. Place it wherever you want the app to live
            3. Double-click — extraction takes ~30 seconds, then EasyScribe launches
            4. Transcripts and recordings are saved to `EasyScribe\recordings\` next to the exe

            ### Re-running
            Double-click the same .exe — detects existing `EasyScribe\` folder and launches in ~1 second.

            ### SmartScreen
            Windows Defender SmartScreen may show **"Windows protected your PC"** — click
            **More info → Run anyway**. Expected for unsigned executables.

            ---
            ### What's new in v2.0.0
            - **Fully portable** — installs next to the .exe, works from USB, no AppData, no admin
            - **sherpa-onnx** replaces faster-whisper — no CUDA DLL headaches
            - **Live microphone transcription** — click Record, speak, get text
            - **Whisper ONNX large-v3-turbo** — single model, no variant selection needed
            - **Crash-safe recording** — interrupted recordings are recoverable on next launch
          files: EasyScribe-${{ github.event.inputs.tag }}-whisper.exe
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
